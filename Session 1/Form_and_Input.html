<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form and Input</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Consolas, monospace;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 450px;
        }

        fieldset {
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        legend {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333333;
            padding: 0 10px;
        }

        label {
            display: block; /* Forces label onto its own line above the input */
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444444;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        #country {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .gender-group, .interest {
            margin-top: 5px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .gender-group label, .interest label {
            display: inline;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="submit"] {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.5s;
        }

        input[type="submit"]:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Form and Input</legend>
            <div>
                <label for="name">Enter your name:</label>
                <input type="text" id="nam e" name="username" placeholder="Your Full Name" required>
            </div>
            <div>
                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="user_email" placeholder="Your Email" required>
            </div>
            <div>
                <label for="password">Enter your password:</label>
                <input type="password" id="password" name="password" placeholder="Your Password" required>
                <label for="confirmPassword">Confirm your password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Your Password" required>
            </div>
            <div>
                <label>Enter your gender:</label>
                <div class="gender-group">
                    <input type="radio" id="male" value="male" name="gender">
                    <label for="male">Male</label>
                    <input type="radio" id="female" value="female" name="gender">
                    <label for="female">Female</label>
                    <input type="radio" id="not_to_say" value="not_to_say" name="gender">
                    <label for="not_to_say">Not to say</label>
                </div>
            </div>
            <div>
                <label for="dob">Enter your Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div>
                <label for="country">Select your Country:</label>
                <select id="country" name="country" required>
                    <option value="">Choose your country</option>
                    <option value="cambodia">Cambodia</option>
                    <option value="thailand">Thailand</option>
                    <option value="vietnam">Vietnam</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label>Select your Interests:</label>
                <div class="interest">
                    <input type="checkbox" id="coding" name="interests" value="coding" checked>
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="design" name="interests" value="design">
                    <label for="design">Design</label>

                    <input type="checkbox" id="gaming" name="interests" value="gaming">
                    <label for="gaming">Gaming</label>
                </div>
                
            </div>

            <input type="submit" value="submit">
            
        </fieldset>
    </form>
</body>
</html>
